[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines allowed; readability compromise
    "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.coverage.run]
omit = ["tests/*"]
