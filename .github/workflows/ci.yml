name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Render Docker image
        run: docker build --tag linkforge:ci .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.13
      - run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: linkforge
          POSTGRES_DB: linkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Vars beat .env in pydantic-settings. The test DB itself is derived:
      # conftest creates linkforge_test alongside this database.
      DATABASE_URL: postgresql+psycopg://linkforge:linkforge@localhost:5432/linkforge
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests + coverage
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
